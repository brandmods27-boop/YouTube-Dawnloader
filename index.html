<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>BeatBox — YouTube Song Search</title>
<style>
:root{--bg:#08090d;--panel:#12141c;--line:#292d3a;--red:#ff304f;--muted:#9da3b4;--white:#f6f7fb}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top right,#28101a 0,#08090d 38%);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{padding:22px 16px 12px;max-width:960px;margin:auto}
.brand{font-size:29px;font-weight:900;letter-spacing:.5px}.brand span{color:var(--red)}
.tag{color:var(--muted);font-size:13px;margin-top:5px}
main{max-width:960px;margin:auto;padding:12px 16px 50px}
.searchbox{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px;border-radius:16px;box-shadow:0 12px 35px #0005}
.searchbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:10px}
button{border:0;border-radius:12px;background:var(--red);color:white;font-weight:800;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 3px 22px}
h2{font-size:18px;margin:22px 0 12px}
.status{padding:18px;border-radius:14px;background:var(--panel);color:var(--muted);text-align:center;line-height:1.5}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(145deg,#171a23,#101219);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.info{padding:12px}.title{font-size:14px;font-weight:800;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.channel{font-size:12px;color:var(--muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:7px;margin-top:12px}.actions a{flex:1;text-decoration:none;text-align:center;font-size:12px;font-weight:800;border-radius:10px;padding:10px 7px;background:var(--red);color:white}.actions a.secondary{background:#292d3a}
footer{text-align:center;color:#73798a;font-size:11px;padding:24px 12px}
@media(min-width:700px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}.brand{font-size:32px}}
@media(max-width:360px){.results{grid-template-columns:1fr}.searchbox button{padding:10px 12px}}
</style>
</head>
<body>
<header>
  <div class="brand">BEAT<span>BOX</span> 🎧</div>
  <div class="tag">Search music videos on YouTube</div>
</header>
<main>
  <form class="searchbox" id="searchForm">
    <input id="query" type="search" placeholder="Song ya singer search karo..." aria-label="Search songs" required>
    <button id="searchBtn" type="submit">SEARCH</button>
  </form>
  <div class="note">YouTube videos search karein aur unhe YouTube par play karein. YouTube Data API se MP3 download nahi hota.</div>
  <h2 id="heading">Song search</h2>
  <div id="status" class="status">Song ka naam likhein aur SEARCH dabayein.</div>
  <section class="results" id="results"></section>
</main>
<footer>BeatBox • Search results and playback are provided by YouTube.</footer>
<script>
/*
  Add your YouTube Data API v3 key below.
  IMPORTANT: GitHub Pages source is public, so browser API keys are visible.
  Restrict the key in Google Cloud to YouTube Data API v3 and your GitHub Pages referrer.
*/
const API_KEY = "AIzaSyA-MmqBRq8OWgdyjigxmfRTY-d9s5Tx05A";

const form = document.getElementById('searchForm');
const queryInput = document.getElementById('query');
const resultsEl = document.getElementById('results');
const statusEl = document.getElementById('status');
const headingEl = document.getElementById('heading');
const searchBtn = document.getElementById('searchBtn');

function escapeHtml(value='') {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showStatus(message) {
  statusEl.hidden = false;
  statusEl.textContent = message;
}
function render(items) {
  resultsEl.innerHTML = '';
  if (!items.length) { showStatus('Koi result nahi mila. Dusra song search karke dekhein.'); return; }
  statusEl.hidden = true;
  for (const item of items) {
    const snippet = item.snippet || {};
    const videoId = item.id && item.id.videoId;
    if (!videoId) continue;
    const thumb = snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url || '';
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <img class="thumb" src="${escapeHtml(thumb)}" alt="" loading="lazy">
      <div class="info">
        <div class="title">${escapeHtml(snippet.title || 'Untitled video')}</div>
        <div class="channel">${escapeHtml(snippet.channelTitle || 'YouTube channel')}</div>
        <div class="actions">
          <a href="https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}" target="_blank" rel="noopener noreferrer">▶ PLAY</a>
          <a class="secondary" href="https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}" target="_blank" rel="noopener noreferrer">OPEN</a>
        </div>
      </div>`;
    resultsEl.appendChild(card);
  }
}
async function searchVideos(q) {
  if (!API_KEY || API_KEY === 'PASTE_YOUR_YOUTUBE_API_KEY_HERE') {
    showStatus('API key add nahi hui. index.html mein API_KEY ke andar apni YouTube Data API v3 key paste karein.');
    return;
  }
  searchBtn.disabled = true;
  searchBtn.textContent = 'SEARCHING…';
  resultsEl.innerHTML = '';
  showStatus('Search ho raha hai…');
  headingEl.textContent = `Results for “${q}”`;
  try {
    const params = new URLSearchParams({
      part:'snippet', type:'video', maxResults:'12', q:q, key:API_KEY,
      videoEmbeddable:'true', safeSearch:'moderate'
    });
    const response = await fetch('https://www.googleapis.com/youtube/v3/search?' + params.toString());
    const data = await response.json();
    if (!response.ok) {
      const reason = data?.error?.errors?.[0]?.reason;
      if (response.status === 403) throw new Error('API access/quota error (' + (reason || '403') + '). Check karein API enabled hai, quota baaki hai aur key restrictions sahi hain.');
      throw new Error(data?.error?.message || 'Search failed.');
    }
    render(data.items || []);
  } catch (err) {
    showStatus(err.message || 'Network error. Internet connection check karein.');
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = 'SEARCH';
  }
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const q = queryInput.value.trim();
  if (q) searchVideos(q);
});
</script>
</body>
</html>
